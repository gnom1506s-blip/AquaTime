name: AquaTime
options:
  deploymentTarget: { iOS: "17.0" }
targets:
  AquaTime:
    type: application
    platform: iOS
    sources: [AquaTime]
    dependencies:
      - target: AquaWidget
    entitlements:
      path: AquaTime/AquaTime.entitlements
    info:
      path: AquaTime/Info.plist
      properties:
        CFBundleDisplayName: AquaTime
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "AquaTime читает данные о выпитой воде"
        NSHealthUpdateUsageDescription: "AquaTime записывает выпитую воду в «Здоровье»"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aquatime]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.aquatime
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Icon0 Icon2 Icon3"
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
  AquaWidget:
    type: app-extension
    platform: iOS
    sources:
      - AquaWidget
      - path: AquaTime/Assets.xcassets
    entitlements:
      path: AquaWidget/AquaWidget.entitlements
    info:
      path: AquaWidget/Info.plist
      properties:
        CFBundleDisplayName: AquaTime
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.aquatime.widget
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
