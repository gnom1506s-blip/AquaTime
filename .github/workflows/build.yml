name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen
      - name: Build (unsigned)
        run: |
          xcodebuild -project AquaTime.xcodeproj -scheme AquaTime -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Embed entitlements (ad-hoc sign)
        run: |
          APP=build/Build/Products/Release-iphoneos/AquaTime.app
          for ex in "$APP"/PlugIns/*.appex; do
            codesign -f -s - --entitlements AquaWidget/AquaWidget.entitlements "$ex"
          done
          codesign -f -s - --entitlements AquaTime/AquaTime.entitlements "$APP"
          codesign -d --entitlements - "$APP"
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AquaTime.app Payload/
          zip -r AquaTime.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AquaTime-ipa
          path: AquaTime.ipa
